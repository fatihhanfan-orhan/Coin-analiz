<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coin Analiz V5.1 Test • Paket A+B</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#08111f;overflow:hidden}
#app{border:0;width:100%;height:100%;display:block;background:#08111f}
#beta{position:fixed;z-index:9999;right:8px;bottom:8px;background:#7c3aed;color:#fff;border-radius:999px;padding:5px 9px;font:700 11px system-ui;opacity:.82;pointer-events:none}
</style>
</head>
<body>
<iframe id="app" src="./index.html?v=511-freeze-fix"></iframe>
<div id="beta">V5.1 TEST • A+B</div>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
 const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;
 const style=d.createElement('style');style.textContent=`
 @media(max-width:720px){body{padding:7px!important}.card,.manualBox,.positionBox{padding:11px!important}.coin-title{font-size:22px!important}.price{font-size:29px!important}.chg{font-size:15px!important}.metric b,.planbox b,.liveBox b,.posMetric b{font-size:11px!important}.metric span,.planbox span,.liveBox span,.posMetric span{font-size:14px!important}.sub,.tiny,.quickBuyNote,.note{font-size:12px!important;line-height:1.4!important}.manualTitle,.positionTitle,.sectionTitle{font-size:20px!important}.manualSub{font-size:13px!important}.manualRow input{font-size:20px!important;padding:14px!important}.manualRow button{font-size:16px!important}.decision{font-size:25px!important}.score{font-size:31px!important}.scorelabel{font-size:11px!important}.why{font-size:13px!important}.liveStrip,.planrow{grid-template-columns:1fr 1fr!important}.posPnl{font-size:24px!important}.posName{font-size:20px!important}}
 .refLine{display:block;margin-top:3px;color:#91a2b8;font-size:.84em;font-weight:650;line-height:1.25}.spreadGood{color:#31d158}.spreadMid{color:#ffbf2f}.spreadBad{color:#ff666d}.idx100{margin-top:6px;padding:7px 9px;border-radius:9px;background:#101f31;border:1px solid #29435f;font-size:13px;font-weight:900}`;d.head.appendChild(style);
 if(typeof w.planUI==='function'){const f=w.planUI;w.planUI=(p,m,h)=>f(p,m,h).replace('FİYAT / BÖLGE MESAFESİ','DESTEĞE MESAFE').replace('STOP REFERANSI','STOP FİYATI').replace('HEDEF 1 / HEDEF 2','DİRENÇ 1 / DİRENÇ 2').replace('RİSK / KAZANÇ (H1)','RİSK 1 → KAZANÇ');}
 if(typeof w.metric==='function'){const f=w.metric;w.metric=(n,v)=>{let h=f(n,v),x=parseFloat(String(v).replace(',','.'));if(n==='RSI 14'&&Number.isFinite(x)){let s=x<30?'AŞIRI SATIM':x<50?'ZAYIF / NÖTR':x<=70?'NÖTR / GÜÇLÜ':'AŞIRI ALIM';h=h.replace('</span>',` → ${s}<small class="refLine">&lt;30 Aşırı Satım • 30–70 Normal • &gt;70 Aşırı Alım</small></span>`)}if(n==='MACD Hist'&&Number.isFinite(x))h=h.replace('</span>',` → ${x<0?'NEGATİF':'POZİTİF'}<small class="refLine">NEGATİF &lt; 0 &gt; POZİTİF</small></span>`);return h}}
 let manual='';if(typeof w.activeCoinNames==='function'){const f=w.activeCoinNames;w.activeCoinNames=()=>[...new Set([...(f()||[]),manual].filter(Boolean))]}
 function clean(){const b=d.getElementById('manualResult');if(!b)return;b.querySelectorAll('button').forEach(x=>{if(x.textContent.trim()==='AL')x.remove()});const q=b.querySelector('.quickBuyBtn');if(q&&!q.disabled)q.textContent='✅ BU FİYATTAN ALDIM'}
 if(typeof w.runManualCoin==='function'){const f=w.runManualCoin;const run=async()=>{manual=String(d.getElementById('manualCoin')?.value||'').trim().toUpperCase().replace(/\/?TRY$/,'').replace(/[^A-Z0-9]/g,'');let r=await f();clean();try{w.startMarketWS?.();w.fetchPositionDepthSnapshot?.(manual)}catch{}return r};w.runManualCoin=run;const b=d.getElementById('manualRun');if(b)b.onclick=run}
 if(typeof w.updateLiveDom==='function'){const f=w.updateLiveDom;w.updateLiveDom=(name,p={})=>{let r=f(name,p),bid=Number(p.bid),ask=Number(p.ask),id=String(name).replace(/[^A-Z0-9]/g,'');if(bid>0&&ask>0){let sp=(ask-bid)/((ask+bid)/2)*100,e=d.getElementById('spread_'+id);if(e){let c=sp<=.20?'spreadGood':sp<=.35?'spreadMid':'spreadBad',t=sp<=.20?'UYGUN':sp<=.35?'SINIRDA':'YÜKSEK';e.className=c;e.innerHTML=`%${sp.toFixed(3)} • ${t}<small class="refLine">Alış–Satış Farkı • maliyet ≈ −%${sp.toFixed(3)}</small>`}}clean();return r}}
 function index100(){d.querySelectorAll('.posCard').forEach(c=>{let p=c.querySelector('[id^="posPnlValue_"]');if(!p)return,x=parseFloat(p.textContent.replace('%','').replace(',','.'));if(!Number.isFinite(x))return;let b=c.querySelector('.idx100');if(!b){b=d.createElement('div');b.className='idx100';c.querySelector('.posHead')?.after(b)}const txt=`100 BAZLI PERFORMANS: ${(100*(1+x/100)).toFixed(2)} • K/Z ${(x>=0?'+':'')+x.toFixed(2)}%`;if(b.textContent!==txt)b.textContent=txt})}
 // Önceki sürümde MutationObserver kendi DOM değişikliklerini tekrar tetikleyerek tarayıcıyı kilitliyordu. Kontrollü aralık kullanıyoruz.
 setInterval(()=>{clean();index100()},1500);clean();index100();
 const mi=d.getElementById('manualCoin');if(mi){mi.placeholder='Coin kodu yaz • Örn: HEMI';mi.setAttribute('aria-label','Coin kodu')}
});
</script>
</body>
</html>
